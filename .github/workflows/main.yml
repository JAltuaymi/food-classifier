name: CI

on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7.0.1

      - name: setup python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.12

      - name: install libraries
        run: pip install -r requirements.txt 

      - name: syntax check
        run: python -m py_compile main.py

      - name: docker build
        run: docker build -t ghcr.io/jaltuaymi/classifier-api:latest .

      - name: docker login
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker push
        run: docker push -t ghcr.io/jaltuaymi/classifier-api:latest 



      

          
