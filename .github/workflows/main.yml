name: CI

on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: setup python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.12

      - name: install libraries
        run: pip install -r requirements.txt 

      - name: syntax check
        run: python -m py_compile main.py

      - name: docker build
        run: docker build -t ghcr.io/jaltuaymi/classifier-api:latest .

      - name: docker login
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker push
        run: docker push ghcr.io/jaltuaymi/classifier-api:latest 

      - name: ec2 deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull ghcr.io/jaltuaymi/classifier-api:latest
            sudo docker rm -f classifier-api || true
            sudo docker run -dp 8000:8000 --name classifier-api ghcr.io/jaltuaymi/classifier-api:latest
            sudo docker image prune -af



      

          
